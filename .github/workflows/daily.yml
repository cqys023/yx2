
name: 每日游戏下载资源采集

on:
  schedule:
    # 每天北京时间凌晨1点运行
    # GitHub 使用 UTC，所以对应前一天17点
    - cron: "0 17 * * *"

  # 允许手动运行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-game-crawler
  cancel-in-progress: false

jobs:
  crawler:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai
      YYDS_USERNAME: ${{ secrets.YYDS_USERNAME }}
      YYDS_PASSWORD: ${{ secrets.YYDS_PASSWORD }}

    steps:
      # 获取仓库代码
      - name: 下载仓库代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # 安装 Python
      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 安装依赖
      - name: 安装运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 执行采集
      - name: 开始每日采集
        run: |
          python -u main.py

      # 保存进度和 Excel 到 GitHub
      - name: 保存采集结果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add progress.json data/

          if ! git diff --cached --quiet; then
            git commit -m "自动更新每日游戏采集数据"
            git push
          else
            echo "没有新的文件需要保存"
          fi
