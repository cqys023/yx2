
name: 每日游戏下载资源采集

on:
  schedule:
    # 每天北京时间凌晨1点
    - cron: "0 17 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-game-crawler
  cancel-in-progress: false

jobs:
  crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 下载仓库代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl

      - name: 执行每日采集
        run: |
          python -u main.py

      - name: 保存 Excel 和进度
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f progress.json data/

          if ! git diff --cached --quiet; then
            git commit -m "自动更新每日游戏采集数据"
            git push
          else
            echo "没有新的数据需要保存"
          fi
